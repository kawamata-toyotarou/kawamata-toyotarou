name: Update contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: "23 18 * * *"
  push:
    branches: [main]
    paths:
      - .github/workflows/snake.yml

concurrency:
  group: contribution-snake
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate the light and dark animations
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#800080
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#800080&color_dots=#eaeef2,#9be9a8,#40c463,#30a14e,#216e39

      - name: Publish the SVGs to the snake-output branch
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ github.token }}
          publish_branch: snake-output
          publish_dir: dist
          enable_jekyll: true
